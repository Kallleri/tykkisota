<style>
/* Layout: kenttä ylhäällä (vaakatilassa vasemmalla), ohjauspaneeli alla (oikealla). Yksi tumma teema. */
:root{
  --bg:#0b0e14;--panel:#141a24;--panel2:#1d2636;--line:#2b3649;
  --fg:#e9eef7;--muted:#8d9ab0;--accent:#ff9f1c;--accent2:#ffd27a;
  --danger:#ff5252;--good:#58d68d;
  --f-display:'Chakra Petch',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;width:100%;aspect-ratio:6/5;flex:none;background:#05070b;min-width:0}
canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}
#hint{margin:2px 0 0;color:var(--muted);font-size:12px;text-align:center}
#panel{flex:1;min-height:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px;
  background:var(--panel);border-top:1px solid var(--line);overflow:auto}
.row{display:flex;align-items:center;gap:8px}
.row label{width:52px;flex:none;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.row output{width:44px;flex:none;text-align:right;font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.05}
.row output small{display:block;font:400 11px var(--f-body);color:var(--muted)}
#btnCam.off,#btnSnd.off{opacity:.55}
input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--accent)}
.btn{min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font:700 18px var(--f-body);cursor:pointer}
.btn:active{background:var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.btn.sm{min-width:0;min-height:32px;padding:0 10px;font-size:12px;font-weight:600}
#wName{flex:1;min-width:0;text-align:center;padding:6px 4px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15}
#wName small{display:block;color:var(--muted);font:400 11px var(--f-body)}
#fire{min-height:56px;border:0;border-radius:12px;background:var(--accent);color:#1a1100;
  font:700 22px var(--f-display);letter-spacing:.1em;cursor:pointer}
#fire:active{filter:brightness(.85)}
#fire:disabled{opacity:.3;cursor:default}
#stageBtns{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
#stageBtns .btn{background:rgba(20,26,36,.82)}
#ov{position:absolute;inset:0;background:rgba(6,8,12,.88);display:flex;align-items:center;justify-content:center;z-index:5}
.hidden{display:none!important}
.card{width:min(520px,calc(100% - 20px));max-height:calc(100% - 16px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:16px}
.card h1{margin:0 0 2px;font:700 28px var(--f-display);color:var(--accent);letter-spacing:.04em}
.cover{text-align:center}.hsname{display:flex;align-items:center;justify-content:center;gap:12px;font:700 28px var(--f-display);margin:14px 0}.hsdot{width:26px;height:26px;border-radius:7px;display:inline-block;border:2px solid rgba(255,255,255,.5)}
.tut{min-height:230px}.tut h2{margin-bottom:10px}.tut p{font-size:15px;line-height:1.45}.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.4}.dots i.on{opacity:1;background:var(--accent)}.tbtns{display:flex;gap:8px}.tbtns .go{flex:1}
.card h2{margin:0 0 8px;font:700 20px var(--f-display)}
.card p{margin:0 0 12px;color:var(--muted);line-height:1.45}
.slot{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slot i{width:14px;height:14px;border-radius:50%;flex:none}
.slot span{width:76px;flex:none}
select{flex:1;min-width:0;min-height:40px;border-radius:8px;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);padding:0 8px;font:600 14px var(--f-body)}
.go{width:100%;min-height:50px;margin-top:10px;border:0;border-radius:12px;background:var(--accent);color:#1a1100;
  font:700 18px var(--f-display);letter-spacing:.06em;cursor:pointer}
.go.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item i{width:12px;height:12px;border-radius:50%;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:600}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item .pr{color:var(--accent2);font:700 13px var(--f-display);text-align:right;white-space:nowrap}
.money{font:700 22px var(--f-display);color:var(--good);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:400;font-size:12px}
@media (orientation:landscape){
  #app{flex-direction:row}
  #stage{aspect-ratio:auto;flex:1;height:100%}
  #panel{flex:none;width:min(240px,34vw);border-top:0;border-left:1px solid var(--line);justify-content:center}
  #hint{display:none}
  .row label{display:none}
  .row output{width:38px}
}
@media (orientation:landscape) and (min-width:1000px){.row label{display:block}#panel{width:min(330px,30vw)}.row output{width:48px}}
.card.shop{display:flex;flex-direction:column;overflow:hidden;height:min(660px,calc(100% - 16px))}
.shophead{flex:none}
.shoplist{flex:1;min-height:0;overflow:auto;margin:0 -4px 4px;padding:0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.tab{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 13px var(--f-body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#1a1100}
.tab i{font-style:normal;margin-left:6px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.3);font-size:11px}
.tab:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.item .nm small.st{color:var(--accent2);opacity:.85}
td.earn{color:var(--good);font-weight:600;text-align:right;white-space:nowrap}
tr.main td{border-bottom:0;padding-bottom:0}
tr.sub td{color:var(--muted);font-size:12px;padding-top:0}
#app.fin #panel{visibility:hidden}
#app.fin #stageBtns{display:none}
#ov.finale{background:transparent;pointer-events:none;align-items:flex-end}
#ov.finale .card{pointer-events:auto;width:min(520px,calc(100% - 20px));max-height:46%;margin-bottom:8px;background:rgba(20,26,36,.94)}
#ov.finale .card h1{font-size:22px}
@media (orientation:landscape){
  #ov.finale{align-items:stretch;justify-content:flex-end}
  #ov.finale .card{width:min(250px,34vw);max-height:none;margin:8px}
}
[hidden]{display:none!important}
.langs{margin:0 0 10px}
.teamhead{font:700 14px var(--f-display);letter-spacing:.06em;margin:12px 0 6px}
input[type=text]{flex:1;min-width:0;min-height:40px;border-radius:8px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:0 10px;font:600 14px var(--f-body);-webkit-user-select:text;user-select:text}
input[type=text]::placeholder{color:var(--muted);font-weight:400}
input[type=text]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.slot.namerow i{background:transparent}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

let AC=null,muted=false,noiseBuf=null;
function audio(){
  if(AC||muted)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}
function sndBoom(size){
  if(muted||!AC)return;
  try{
    const t=AC.currentTime,dur=0.35+size*0.012,src=AC.createBufferSource();src.buffer=noiseBuf;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900+size*10,t);f.frequency.exponentialRampToValueAtTime(60,t+dur);
    const g=AC.createGain();g.gain.setValueAtTime(clamp(0.25+size/200,0.2,0.9),t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t,Math.random()*0.5,dur);
  }catch(e){}
}
function sndShot(){
  if(muted||!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(60,t+0.25);
    g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.3);
  }catch(e){}
}

/* ====== Maasto ====== */
let ground=new Float32Array(W);
let th=THEMES[0],bgCv,tCv,tctx,speck=[],stars=[],terrDirty=true;
function mkCanvas(){const c=document.createElement('canvas');c.width=W*S;c.height=H*S;return c;}
function surf(x){return ground[clamp(Math.round(x),0,W-1)];}
function genTerrain(){
  const base=H*srnd(.56,.68),amp=srnd(.7,1.35),fr=[],ph=[],am=[];
  for(let i=0;i<5;i++){
    fr.push((i+1)*srnd(.8,1.5)*Math.PI*2/W);ph.push(srnd(0,6.28));
    am.push(H*.17*amp/(i*.9+1)*srnd(.6,1.2));
  }
  for(let x=0;x<W;x++){let y=base;for(let i=0;i<5;i++)y+=Math.sin(x*fr[i]+ph[i])*am[i];ground[x]=clamp(y,H*.24,H*.88);}
  for(let p=0;p<2;p++)for(let x=1;x<W-1;x++)ground[x]=(ground[x-1]+ground[x]*2+ground[x+1])/4;
}
function buildSky(){
  if(!bgCv){bgCv=mkCanvas();}
  const c=bgCv.getContext('2d');c.setTransform(S,0,0,S,0,0);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(.55,th.sky[1]);g.addColorStop(1,th.sky[2]);
  c.fillStyle=g;c.fillRect(0,0,W,H);
  if(th.stars){c.fillStyle='#fff';for(let i=0;i<110;i++){c.globalAlpha=rnd(.3,1);c.fillRect(rnd(0,W),rnd(0,H*.55),rnd(.6,1.6),rnd(.6,1.6));}c.globalAlpha=1;}
  const sx=th.sun[0]*W,sy=th.sun[1]*H;
  const sg=c.createRadialGradient(sx,sy,2,sx,sy,90);sg.addColorStop(0,th.sun[2]);sg.addColorStop(.25,th.sun[2]+'aa');sg.addColorStop(1,th.sun[2]+'00');
  c.fillStyle=sg;c.fillRect(sx-100,sy-100,200,200);
  c.fillStyle=th.sun[2];c.beginPath();c.arc(sx,sy,14,0,6.283);c.fill();
  for(let L=0;L<2;L++){
    c.fillStyle=th.mtn[L];c.beginPath();c.moveTo(0,H);
    const b=H*(.5+L*.08),a=rnd(40,80)*(1-L*.3),f1=rnd(.006,.011),f2=rnd(.015,.03),p1=rnd(0,6),p2=rnd(0,6);
    for(let x=0;x<=W;x+=4)c.lineTo(x,b-Math.abs(Math.sin(x*f1+p1))*a-Math.sin(x*f2+p2)*a*.25);
    c.lineTo(W,H);c.closePath();c.fill();
  }
  speck=[];for(let i=0;i<1400;i++)speck.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,2.2),l:Math.random()<.5});
}
function buildTerrain(){
  if(!tCv){tCv=mkCanvas();tctx=tCv.getContext('2d');}
  const c=tctx;c.setTransform(S,0,0,S,0,0);c.clearRect(0,0,W,H);
  c.beginPath();c.moveTo(0,H);for(let x=0;x<W;x++)c.lineTo(x,ground[x]);c.lineTo(W,H);c.closePath();
  const g=c.createLinearGradient(0,H*.2,0,H);g.addColorStop(0,th.soil[0]);g.addColorStop(.5,th.soil[1]);g.addColorStop(1,th.soil[2]);
  c.fillStyle=g;c.fill();
  c.save();c.clip();
  for(let i=0;i<speck.length;i++){const s=speck[i];c.fillStyle=s.l?'rgba(255,255,255,.07)':'rgba(0,0,0,.22)';c.fillRect(s.x,s.y,s.r,s.r);}
  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=5;
  for(let b=0;b<5;b++){c.beginPath();const y0=H*(.5+b*.1);for(let x=0;x<=W;x+=10)c.lineTo(x,y0+Math.sin(x*.012+b*2)*9);c.stroke();}
  c.restore();
  c.beginPath();for(let x=0;x<W;x++)x?c.lineTo(x,ground[x]):c.moveTo(x,ground[x]);
  c.lineJoin='round';c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=7;c.stroke();
  c.strokeStyle=th.grass;c.lineWidth=4;c.stroke();
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1.2;c.translate(0,-1.4);c.stroke();
  terrDirty=false;
}
let mask=new Uint8Array(W*H);
function solid(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||x>=W||y<0)return false;if(y>=H)return true;return mask[y*W+x]===1;}
function recalcCols(a,b){
  for(let x=a;x<=b;x++){let y=0;while(y<H&&!mask[y*W+x])y++;ground[x]=y;}
}
/* Jalkojen y-koordinaatti: putoaa alaspäin ensimmäiseen kiinteään pikseliin. Haudattu pysyy paikallaan. */
function standY(x,y){
  const xi=clamp(Math.round(x),0,W-1);let yy=Math.max(0,Math.floor(y));
  if(yy>0&&mask[(yy-1)*W+xi])return y;
  while(yy<H&&!mask[yy*W+xi])yy++;
  return yy;
}
function edgePoint(ox,oy,nx,ny){
  let ax=ox,ay=oy,bx=nx,by=ny;
  for(let i=0;i<5;i++){const mx=(ax+bx)/2,my=(ay+by)/2;if(solid(mx,my)){bx=mx;by=my;}else{ax=mx;ay=my;}}
  return {x:bx,y:by};
}
function commitTerrain(){
  if(mask.length!==W*H)mask=new Uint8Array(W*H);else mask.fill(0);
  for(let x=0;x<W;x++){const g=clamp(Math.round(ground[x]),1,H-5);ground[x]=g;for(let y=g;y<H;y++)mask[y*W+x]=1;}
  buildTerrain();
}
function crater(x,y,r){
  const x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),r2=r*r;
  for(let i=x0;i<=x1;i++){
    const dx=i+.5-x,h=r2-dx*dx;if(h<0)continue;const d=Math.sqrt(h);
    const ya=Math.max(0,Math.ceil(y-d-.5)),yb=Math.min(H-4,Math.floor(y+d-.5));
    for(let j=ya;j<=yb;j++)mask[j*W+i]=0;
  }
  recalcCols(x0,x1);
  if(!tctx)return;
  const c=tctx;c.save();c.setTransform(S,0,0,S,0,0);
  c.beginPath();c.rect(0,0,W,H-4);c.clip();
  c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();
  c.globalCompositeOperation='source-atop';c.strokeStyle='rgba(20,10,5,.5)';c.lineWidth=2.6;
  c.beginPath();c.arc(x,y,r+1.3,0,6.283);c.stroke();
  c.restore();
}
function addDirt(x,y,r){
  const x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),r2=r*r;
  for(let i=x0;i<=x1;i++){
    const dx=i+.5-x,h=r2-dx*dx;if(h<0)continue;const d=Math.sqrt(h);
    const ya=Math.max(0,Math.ceil(y-d-.5)),yb=Math.min(H-1,Math.floor(y+d-.5));
    for(let j=ya;j<=yb;j++)mask[j*W+i]=1;
  }
  recalcCols(x0,x1);
  if(!tctx)return;
  const c=tctx;c.save();c.setTransform(S,0,0,S,0,0);
  const g=c.createRadialGradient(x,y-r*.4,1,x,y,r);g.addColorStop(0,th.soil[0]);g.addColorStop(1,th.soil[1]);
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1.4;c.beginPath();c.arc(x,y,r,Math.PI,0);c.stroke();
  c.restore();
}

function startDeath(t,kind){
  const x=t.x,y=t.y-6,q=nextQuote(),r=sr();

function stepAir(t,dt){
  const a=t.air;a.age+=dt;
  t.vy+=320*dt;t.y+=t.vy*dt;t.x=clamp(t.x+a.vx*dt,8,W-8);
  t.rot=Math.PI*Math.min(1,a.age/a.dur);
  const gy=standY(t.x,t.y-4);
  if(t.vy>0&&t.y>=gy){
    t.y=gy;t.air=null;t.vy=0;t.fall=0;t.rot=Math.PI;
    shake=Math.max(shake,3);sndBoom(10);

  }
}

const sameTeam=(a,b)=>a&&b&&a.team>=0&&a.team===b.team;
function applyDamage(t,amt,src,quiet){
  if(!t.alive||amt<=0)return 0;
  if(t.mag>0&&src){t.mag=0;t.magAge=null;floatText(t.x,t.y-34,T('fx_magnet_down'),'#e599f7');}
  if(t.shield>0){const a=Math.min(t.shield,amt);t.shield-=a;amt-=a;t.flash=0.25;
    if(t.shield<=0){floatText(t.x,t.y-26,T('fx_shield_down'),'#7fe3f0');}}
  if(amt<=0)return 0;
  const dealt=Math.min(t.hp,amt);t.hp-=amt;
  if(src&&src!==t&&!sameTeam(src,t)){t.hitBy=src.i;src.money+=dealt*6;src.earn.dmg+=dealt*6;}
  if(quiet){t.acc+=amt;if(t.acc>=6){floatText(t.x+rnd(-8,8),t.y-26,'-'+Math.round(t.acc),'#ffb36b');t.acc=0;}}
  else floatText(t.x,t.y-26,'-'+Math.round(amt),'#ff6b6b');
  if(t.hp<=0&&t.alive){
    t.hp=0;t.alive=false;
    if(src&&src!==t&&!sameTeam(src,t)){src.money+=KILL_BONUS;src.kills++;src.earn.kills+=KILL_BONUS;src.earn.nk++;floatText(src.x,src.y-42,'+'+money(KILL_BONUS)+' '+T('fx_kill'),'#ffd27a');}
    startDeath(t);
  }
  return dealt;
}
function explode(x,y,r,dmg,owner,col){
  crater(x,y,r);
  spawnBlast(x,y,r,col);
  shake=Math.max(shake,Math.min(14,r/7));
  sndBoom(r);
  if(dmg>0){
    for(const t of tanks){
      if(!t.alive)continue;
      const d=Math.hypot(t.x-x,(t.y-6)-y),reach=r+11;
      if(d<reach){const f=clamp((1-d/reach)*1.25,0,1);applyDamage(t,dmg*f,owner);}
    }
  }
}
function doSplit(p){
  const s=p.w.sp,n=s.n,c=(n-1)/2;
  spawnBlast(p.x,p.y,10,'#bde0fe');
  for(let i=0;i<n;i++){
    let vx,vy;
    if(s.rv>=60&&p.w.id==='funky'){const a=srnd(0,6.283),sp=srnd(30,s.s);vx=p.vx*.4+Math.cos(a)*sp*1.6;vy=Math.sin(a)*sp*1.6-20;}
    else{vx=p.vx+(i-c)*s.s;vy=Math.max(p.vy,0)+srnd(-6,6);}
    projs.push({x:p.x,y:p.y,vx,vy,w:WID[s.id],owner:p.owner,t:0,hops:0,trail:[],grp:p.grp,msd:p.msd,main:!!p.main&&i===Math.floor(c)});
  }
}
function impact(p){
  const w=p.w,x=p.x,y=p.y;
  if(p.main&&p.owner)p.owner.lastImp={x,y};
  if(p.main&&p.owner&&p.owner.lvl&&p.owner.lastAim)p.owner.mem={tid:p.owner.lastAim.tid,dx:p.owner.lastAim.tx-x};
  if(w.mv==='laser'&&p.sx!=null)trails.push({pts:[p.sx,p.sy,x,y],life:.4,beam:1});
  switch(w.k){
    case 'std':explode(x,y,w.r,w.dmg,p.owner,w.col);break;
    case 'split':explode(x,y,22,30,p.owner,w.col);break;
    case 'leap':
      explode(x,y,w.r,w.dmg,p.owner,w.col);
      if(p.hops>0)projs.push({x,y:y-4,vx:p.vx*.85,vy:-Math.max(Math.abs(p.vy),140)*.62,w,owner:p.owner,t:0.3,hops:p.hops-1,trail:[],grp:p.grp,msd:p.msd});
      break;
    case 'roll':rolls.push({x:clamp(x,2,W-3),y,vx:p.vx*.25,w,owner:p.owner,t:0,still:0});spawnBlast(x,y,6,'#ffe8a3');break;
    case 'dig':burrows.push({x,y,dx:p.vx*.4,dy:Math.max(Math.abs(p.vy),60),sp:90,dur:.75,t:0,carve:9,w,owner:p.owner,boom:false});sndBoom(14);break;
    case 'burrow':burrows.push({x,y,dx:p.vx*.25,dy:Math.max(Math.abs(p.vy),60),sp:140,dur:.22,t:0,carve:7,w,owner:p.owner,boom:true});sndBoom(10);break;
    case 'dirt':addDirt(x,y,w.r);spawnBlast(x,y,10,'#a47148');sndBoom(30);shake=Math.max(shake,3);break;
    case 'fire':
      explode(x,y,10,12,p.owner,w.col);
      fires.push({x,y,r:w.r,ttl:w.ttl,dps:w.fdps,t:0,owner:p.owner,w});break;
    case 'tracer':spawnBlast(x,y,4,'#ffffff');trails.push({pts:p.trail.slice(),life:5,tr:1});break;
  }
}


/* ====== Erikoisliikkeet: liito, drooni, magneettisuoja ====== */
let MAG_R=72,MAG_A=.8;const DRONE_V=170;
let grpN=0;
function droneTarget(p){
  const a0=Math.atan2(p.vy,p.vx);let best=null,bd=9;
  for(const t of tanks){
    if(!t.alive||t===p.owner)continue;
    let d=Math.abs(Math.atan2(t.y-8-p.y,t.x-p.x)-a0);if(d>Math.PI)d=2*Math.PI-d;
    if(d<bd){bd=d;best=t;}
  }
  return best;
}
function droneSteer(p,dt){
  if(!p.tg||!p.tg.alive)p.tg=droneTarget(p);
  if(!p.tg){p.lost=1;p.vy+=G*dt;return;}
  const tx=p.tg.x,dx=tx-p.x,lift=clamp((Math.abs(dx)-40)*.4,0,90);
  const ty=p.tg.y-8-lift;
  let want=Math.atan2(ty-p.y,dx),cur=Math.atan2(p.vy,p.vx),d=want-cur;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  const m=clamp(d,-2.4*dt,2.4*dt);cur+=m;
  p.vx=Math.cos(cur)*DRONE_V;p.vy=Math.sin(cur)*DRONE_V;
  if(Math.random()<.5)addPart({x:p.x,y:p.y,vx:rnd(-12,12),vy:rnd(-12,12),life:.35,max:.35,s:2,col:'#e599f7',t:'f'});
}
function magnetPush(p,dt){
  for(const t of tanks){
    if(!t.alive||t===p.owner)continue;
    if(!(t.mag>0))continue;
    const dx=p.x-t.x,dy=p.y-(t.y-8),d=Math.hypot(dx,dy);
    if(d>MAG_R)continue;
    if(p.msd==null)floatText(t.x,t.y-30,T('fx_magnet'),'#e599f7');
    const sp=Math.hypot(p.vx,p.vy)||1,nx=-p.vy/sp,ny=p.vx/sp,k=1-d/MAG_R;
    if(p.msd==null)p.msd=Math.sign(nx*dx+ny*dy)||((p.grp||0)%2?1:-1);
    const mv=MAG_A*k*clamp(sp,150,500)*dt*p.msd;p.x+=nx*mv;p.y+=ny*mv;
    if(Math.random()<.35)addPart({x:p.x,y:p.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.3,max:.3,s:2,col:'#e599f7',t:'f'});
  }
}
function moveProj(p,dt){
  const mv=p.w.mv;
  if(mv==='laser'){}
  else if(mv==='drone'&&p.t<6.5&&!p.lost){if(p.t>.45)droneSteer(p,dt);}
  else if(mv==='glide'&&p.vy>0&&p.t>.2){
    p.vy=Math.min(p.vy+G*.22*dt,55);p.vx+=wind*dt*.6;p.vx-=p.vx*.25*dt;
  }else{p.vy+=G*dt;p.vx+=wind*dt;}
  magnetPush(p,dt);
  p.x+=p.vx*dt;p.y+=p.vy*dt;
}

/* ====== Fysiikka ====== */
function stepWorld(dt){
  time+=dt;
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.t+=dt;
    const ox=p.x,oy=p.y;
    moveProj(p,dt);
    if(wallMode===1){if(p.x<0){p.x=-p.x;p.vx=-p.vx;}else if(p.x>W){p.x=2*W-p.x;p.vx=-p.vx;}}
    else if(wallMode===2){if(p.x<0){p.x+=W;p.trail.length=0;}else if(p.x>=W){p.x-=W;p.trail.length=0;}}
    if((p.n=(p.n||0)+1)%4===0){p.trail.push(p.x,p.y);if(p.trail.length>56)p.trail.splice(0,2);}
    if(p.n%3===0&&p.w.id!=='tracer')addPart({x:p.x,y:p.y,vx:rnd(-8,8),vy:rnd(-8,8),life:.5,max:.5,s:2.2,col:'#bbb',t:'m',drag:2});
    if((wallMode===0&&(p.x<-40||p.x>W+40))||p.y>H+60||p.t>14){
      if(p.w.k==='tracer')trails.push({pts:p.trail.slice(),life:5,tr:1});
      if(p.w.mv==='laser'&&p.sx!=null)trails.push({pts:[p.sx,p.sy,p.x,p.y],life:.4,beam:1});
      projs.splice(i,1);continue;}
    if(p.w.k==='split'&&p.vy>0&&p.t>.2){doSplit(p);projs.splice(i,1);continue;}
    let hit=false;
    const near=Math.abs(p.x-ox)<60;
    if(solid(p.x,p.y)||(near&&solid((p.x+ox)/2,(p.y+oy)/2))){
      hit=true;
      if(near){const e=edgePoint(ox,oy,p.x,p.y);p.x=e.x;p.y=e.y;}
    }else for(const t of tanks){
      if(!t.alive||(t===p.owner&&p.t<.3))continue;
      if(Math.hypot(p.x-t.x,p.y-(t.y-6))<9){hit=true;break;}
    }
    if(hit){projs.splice(i,1);impact(p);}
  }
  for(let i=rolls.length-1;i>=0;i--){
    const r=rolls[i];r.t+=dt;
    const slope=(standY(r.x+2,r.y-6)-standY(r.x-2,r.y-6))/4;
    r.vx+=slope*420*dt;r.vx-=r.vx*.8*dt;
    r.x+=r.vx*dt;
    let boom=r.x<=2||r.x>=W-3||r.t>5;
    if(solid(r.x,r.y-4))boom=true;
    r.y=standY(r.x,r.y-6)-3;
    if(Math.abs(r.vx)<12)r.still+=dt;else r.still=0;
    if(r.still>.35)boom=true;
    for(const t of tanks){
      if(!t.alive||(t===r.owner&&r.t<.4))continue;
      if(Math.hypot(r.x-t.x,r.y-(t.y-5))<11)boom=true;
    }
    if(Math.random()<.5)addPart({x:r.x,y:r.y,vx:rnd(-10,10),vy:-rnd(5,25),life:.4,max:.4,s:2,col:'#ccc',t:'m'});
    if(boom){rolls.splice(i,1);explode(r.x,r.y+3,r.w.r,r.w.dmg,r.owner,r.w.col);}
  }
  for(let i=burrows.length-1;i>=0;i--){
    const b=burrows[i];b.t+=dt;
    const l=Math.hypot(b.dx,b.dy)||1;
    b.x+=b.dx/l*b.sp*dt;b.y+=b.dy/l*b.sp*dt;
    crater(b.x,b.y,b.carve);
    if(Math.random()<.7)addPart({x:b.x,y:b.y,vx:rnd(-30,30),vy:-rnd(20,70),life:.5,max:.5,g:200,s:2,col:th.soil[0],t:'d'});
    if(b.x<0||b.x>W||b.y>H-2||b.t>=b.dur){
      burrows.splice(i,1);
      if(b.boom)explode(clamp(b.x,0,W),Math.min(b.y,H-4),b.w.r,b.w.dmg,b.owner,b.w.col);
    }
  }
  for(let i=fires.length-1;i>=0;i--){
    const f=fires[i];f.t+=dt;
    if((f.mv||0)<45){const dx=clamp(surf(f.x+5)-surf(f.x-5),-14,14)*3.2*dt;f.x=clamp(f.x+dx,5,W-5);f.mv=(f.mv||0)+Math.abs(dx);}
    for(const t of tanks){
      if(!t.alive)continue;
      if(Math.abs(t.x-f.x)<f.r*.85)applyDamage(t,f.dps*dt,f.owner,true);
    }
    if(Math.random()<.9){const x=f.x+rnd(-f.r,f.r);addPart({x,y:surf(x)-2,vx:rnd(-6,6),vy:-rnd(20,60),life:rnd(.3,.7),max:.7,s:rnd(2,4),col:pick(['#ffd166','#ff9f1c','#ff6b35']),t:'f',g:-40});}
    if(f.t>=f.ttl)fires.splice(i,1);
  }
  for(let i=pending.length-1;i>=0;i--){
    const b=pending[i];b.delay-=dt;
    if(b.delay<=0){pending.splice(i,1);explode(b.x,b.y,b.r,b.dmg,b.owner,'#ffb347');
      if(b.burst)sparkBurst(b.x,b.y,b.burst,b.r>=20?260:190);
      if(b.chunk&&b.tank)chunks(b.tank,b.r>=20?5:3,b.r>=20?170:120,b.x,b.y);}
  }
  if(phase!=='finale')settleTanks(dt);
  for(const t of tanks){
    if(t.dying>0)t.dying-=dt;
    if(t.say){t.say.t+=dt;if(t.say.t>t.say.dur)t.say=null;}
    if(!t.alive&&t.smoulder>0){
      t.smoulder-=dt;
      if(Math.random()<dt*14)addPart({x:t.x+rnd(-8,8),y:t.y-rnd(6,14),vx:rnd(-6,6)+wind*.2,vy:-rnd(20,45),life:rnd(1,1.8),max:1.8,s:rnd(3,6),col:'#2a2d33',t:'m',g:-10});
      if(Math.random()<dt*8)addPart({x:t.x+rnd(-7,7),y:t.y-rnd(4,10),vx:rnd(-10,10),vy:-rnd(20,50),life:rnd(.25,.55),max:.55,s:rnd(2,3.5),col:pick(['#ffd166','#ff9f1c','#ff6b35']),t:'f',g:-30});
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.vr)p.rot+=p.vr*dt;
    p.vy+=p.g*dt;if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if((p.t==='d'||p.t==='c')&&solid(p.x,p.y)){parts.splice(i,1);}
  }
  for(let i=blasts.length-1;i>=0;i--){blasts[i].t+=dt;if(blasts[i].t>blasts[i].dur)blasts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;if(t.t>1.3)texts.splice(i,1);}
  for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1);}
  for(const t of tanks){if(t.flash>0)t.flash-=dt;t.dHp+=(t.hp-t.dHp)*Math.min(1,dt*6);}
  shake*=Math.max(0,1-dt*6);
}
function settleTanks(dt){
  for(const t of tanks){
    if(!t.alive&&t.air){stepAir(t,dt);continue;}
    const gy=standY(t.x,t.y);
    if(gy>t.y+.5){
      t.vy+=320*dt;
      if(t.alive&&(t.inv.parachute||0)>0)t.vy=Math.min(t.vy,70);
      const dy=t.vy*dt;t.y=Math.min(gy,t.y+dy);t.fall+=dy;
      if(t.y>=gy)landTank(t);
    }else if(t.fall>0)landTank(t);
  }
}
function landTank(t){
  if(!t.alive){t.fall=0;t.vy=0;return;}
  if(t.fall>14){
    if((t.inv.parachute||0)>0){t.inv.parachute--;floatText(t.x,t.y-26,'Laskuvarjo','#ffe066');}
    else applyDamage(t,(t.fall-14)*.8,null);
  }
  t.fall=0;t.vy=0;
}
function busy(){
  if(projs.length||rolls.length||burrows.length||fires.length||pending.length)return true;
  for(const t of tanks){if(t.dying>0||t.air)return true;if(t.alive&&standY(t.x,t.y)>t.y+.5)return true;}
  return false;
}

function shade(hex,k){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(k>=0){r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}else{r*=1+k;g*=1+k;b*=1+k;}
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(0,-9,7.2,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();break;}
  case 3:{ // laatikko: korkea tornilaatikko
    tracks(12,5.6);ctx.fillStyle=g;rr(-10.5,-10,21,5,1);ctx.fill();ctx.stroke();
    ctx.fillStyle=g2;rr(-6.5,-15,13,6.2,1.4);ctx.fill();ctx.stroke();break;}
  case 4:{ // pyörätankki: kolme isoa pyörää
    ctx.fillStyle='#14161a';for(const x of[-8,0,8]){ctx.beginPath();ctx.arc(x,-3.6,3.9,0,6.283);ctx.fill();}

    ctx.fillStyle=g2;ctx.beginPath();ctx.ellipse(0,-9.6,5,3.8,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#14161a';ctx.fillRect(-1.2,-4.4,2.4,2.6);break;}
  case 6:{ // pyramidi: kolmiotorni
    tracks(12,5.6);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(10,-5);ctx.lineTo(6,-9.5);ctx.lineTo(-6,-9.5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(-7,-9.5);ctx.lineTo(0,-16);ctx.lineTo(7,-9.5);ctx.closePath();ctx.fill();ctx.stroke();break;}

function drawProj(p){

    ctx.strokeStyle='rgba(255,77,141,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(p.x,p.y);ctx.stroke();

    ctx.fillStyle=w.col;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=.8;

    else{ctx.fillRect(-5,-2.5,10,5);ctx.strokeRect(-5,-2.5,10,5);ctx.strokeStyle=w.col;ctx.lineWidth=1.4;
      const rt=Math.sin(time*80)*5;ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(-3+rt,-4);ctx.moveTo(3,4);ctx.lineTo(3-rt,4);ctx.stroke();}
    ctx.restore();return;
  }
  if(p.trail.length>3){
    ctx.lineCap='round';
    const n=p.trail.length/2;
    for(let i=1;i<n;i++){
      ctx.strokeStyle='rgba(255,255,255,'+(i/n*.5)+')';ctx.lineWidth=.8+i/n*1.6;
      ctx.beginPath();ctx.moveTo(p.trail[i*2-2],p.trail[i*2-1]);ctx.lineTo(p.trail[i*2],p.trail[i*2+1]);ctx.stroke();

const cam={x:400,y:225,z:1};let camOn=!!cfg.cam,aimDrag=null;

    if(f)camF={x:f.x,y:f.y};
  }else camF=null;
  const zt=follow?1.8:1;
  cam.z+=(zt-cam.z)*Math.min(1,dt*4);

/* ====== Tekoäly ====== */
/* aN/pN: tähtäysvirhe, wk: tuulen tuntemus, aS/pS: hakuaskeleet, mem: edellisen osuman korjaus,
   sh: kilven käyttö, think: miettimisaika, roll: osaa käyttää vierittäjiä */
const LV=[null,
 {aN:17,pN:26,wk:0,aS:4,pS:8,mem:0,sh:0,think:1.7,roll:0},
 {aN:8.5,pN:12.5,wk:.15,aS:3,pS:6,mem:0,sh:.15,think:1.3,roll:0},
 {aN:4.5,pN:7,wk:.5,aS:2,pS:4,mem:.5,sh:.4,think:1,roll:1},
 {aN:2.4,pN:4,wk:.85,aS:1,pS:3,mem:.4,sh:.7,think:.8,roll:1},
 {aN:.8,pN:1.6,wk:1,aS:1,pS:2,mem:0,sh:.9,think:.6,roll:1}];
function tipFor(t,a){const r=a*Math.PI/180;return {x:t.x+Math.cos(r)*17,y:t.y-9-Math.sin(r)*17};}
function simShot(x0,y0,ang,pow,wnd,mv){
  const a=ang*Math.PI/180,v=pow*VM,dt=1/120;
  let x=x0,y=y0,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
  for(let n=0;n<1800;n++){
    const ox=x,oy=y;
    if(mv==='glide'&&vy>0&&n*dt>.2){vy=Math.min(vy+G*.22*dt,55);vx+=wnd*dt*.6;vx-=vx*.25*dt;}
    else{vy+=G*dt;vx+=wnd*dt;}
    x+=vx*dt;y+=vy*dt;
    if(wallMode===1){if(x<0){x=-x;vx=-vx;}else if(x>W){x=2*W-x;vx=-vx;}}
    else if(wallMode===2){if(x<0)x+=W;else if(x>=W)x-=W;}
    if((wallMode===0&&(x<-40||x>W+40))||y>H+60)return {x,y,vx,out:true};
    const near=Math.abs(x-ox)<60;
    if(solid(x,y)||(near&&solid((x+ox)/2,(y+oy)/2))){
      if(near){const e=edgePoint(ox,oy,x,y);return {x:e.x,y:e.y,vx};}
      return {x,y,vx};
    }
  }
  return {x,y,vx,out:true};
}
function simRoll(x,y,vx,self){
  const dt=1/120;let still=0;
  for(let n=0;n<600;n++){
    for(const o of tanks){if(!o.alive||(o===self&&n*dt<.4))continue;if(Math.hypot(x-o.x,y-(o.y-5))<11)return {x,y:y+3};}
    const slope=(standY(x+2,y-6)-standY(x-2,y-6))/4;
    vx+=slope*420*dt;vx-=vx*.8*dt;x+=vx*dt;
    if(x<=2||x>=W-3)break;
    if(solid(x,y-4))break;
    y=standY(x,y-6)-3;
    if(Math.abs(vx)<12)still+=dt;else still=0;
    if(still>.35)break;
  }
  return {x,y:y+3};
}
function solveShot(t,target,wnd,aS,pS,pmax,roll,mv){
  let best=null;
  const farSelf=Math.hypot(target.x-t.x,target.y-t.y)>70;
  const test=(a,p)=>{
    const tip=tipFor(t,a);
    let r=simShot(tip.x,tip.y,a,p,wnd,mv);
    if(roll&&!r.out)r=simRoll(r.x,r.y,r.vx*.25,t);
    let e=Math.hypot(r.x-target.x,r.y-target.y);
    if(r.out)e+=500;
    if(farSelf&&Math.hypot(r.x-t.x,r.y-t.y)<32)e+=300;
    if(!best||e<best.e)best={a,p,e};
  };
  for(let a=8;a<=172;a+=aS)for(let p=10;p<=pmax;p+=pS)test(a,p);
  if(!best)test(60,pmax);
  const a0=best.a,p0=best.p;
  for(let da=-aS;da<=aS;da+=Math.max(.25,aS/4))for(let dp=-pS;dp<=pS;dp+=Math.max(.5,pS/4)){
    const a=clamp(a0+da,0,180),p=clamp(p0+dp,5,pmax);test(a,p);
  }
  return best;
}
function aiWeapons(t){
  const kinds=['std','split','leap','fire','burrow'];
  if(LV[t.lvl].roll)kinds.push('roll');
  return WP.filter(w=>!w.hid&&(t.inv[w.id]>0||w.inf)&&kinds.includes(w.k)&&(w.dmg>0||w.k==='split'||w.k==='fire'));
}
function wPower(w){return w.k==='split'?(w.sp.s>=40?250:150):w.k==='fire'?w.fdps*w.ttl*.8:(w.dmg||0)+(w.r||0)*.5;}
function losClear(t,target){
  const a=Math.atan2(-(target.y-6-(t.y-9)),target.x-t.x),tip=tipFor(t,a*180/Math.PI);
  const dx=target.x-tip.x,dy=target.y-6-tip.y,n=Math.ceil(Math.hypot(dx,dy)/4);
  for(let i=1;i<n;i++){if(solid(tip.x+dx*i/n,tip.y+dy*i/n))return false;}
  return true;
}
function aiChooseWeapon(t,target){
  const L=t.lvl,base=WID.baby,los=losClear(t,target);
  const list=aiWeapons(t).filter(w=>w.mv!=='laser'||los);
  if(L===1)return Math.random()<.8?base:pick(list);
  if(L===2)return Math.random()<.5?base:pick(list);
  const dist=Math.abs(target.x-t.x);
  const safe=list.filter(w=>!(w.r>=55&&dist<w.r*1.7)&&!(w.k==='split'&&w.sp.s>=40&&dist<110)&&!(L>=4&&w.id==='funky'));
  const pool=safe.length?safe:[base];
  const strong=pool.slice().sort((a,b)=>wPower(b)-wPower(a));
  const P=t.pers,r=Math.random();
  if(P==='bers'){const all=list.slice().sort((a,b)=>wPower(b)-wPower(a));if(r<.7)return all[0]||base;}
  else if(P==='aggr'&&r<.35)return strong[0];
  else if(P==='tyc'&&r<.4)return strong[0];
  else if(P==='trick'&&r<.55){const sp=pool.filter(w=>w.mv||['leap','burrow','split','fire'].includes(w.k));if(sp.length)return pick(sp);}
  else if(P==='snip'&&r<.5){const pr=pool.filter(w=>w.k==='std'&&(w.r||0)<=55).sort((a,b)=>wPower(b)-wPower(a));if(pr.length)return pr[0];}
  else if(P==='def'&&r<.35){const e=pool.filter(w=>wPower(w)>=(target.hp+target.shield)*1.1&&w.k!=='fire').sort((a,b)=>wPower(a)-wPower(b));if(e.length)return e[0];}
  else if(P==='tact'&&r<.3&&los){const l=pool.find(w=>w.mv==='laser');if(l)return l;}
  if(L===3)return Math.random()<.65?strong[0]:pick(pool);
  if(L===4)return Math.random()<.85?strong[0]:pick(pool);
  const eff=(target.hp+target.shield);
  const enough=pool.filter(w=>wPower(w)>=eff*1.1&&w.k!=='fire').sort((a,b)=>wPower(a)-wPower(b));
  return enough.length?enough[0]:strong[0];
}
function aiChooseTarget(t){
  const en=tanks.filter(o=>o!==t&&o.alive&&!sameTeam(t,o));
  if(!en.length)return null;
  const L=t.lvl;
  if(L===1)return pick(en);
  const P=t.pers,eff=o=>o.hp+o.shield;
  if(P==='aven'&&t.hitBy!=null){const h=en.find(o=>o.i===t.hitBy);if(h)return h;}
  if(P==='tyc')return en.slice().sort((x,y)=>y.money-x.money)[0];
  if(P==='aggr')return en.slice().sort((x,y)=>eff(x)-eff(y))[0];
  if(P==='trick'&&Math.random()<.5)return pick(en);
  const byDist=en.slice().sort((a,b)=>Math.abs(a.x-t.x)-Math.abs(b.x-t.x));
  if(L<=3)return byDist[0];
  return en.slice().sort((a,b)=>(a.hp+a.shield+Math.abs(a.x-t.x)/8)-(b.hp+b.shield+Math.abs(b.x-t.x)/8))[0];
}
const PM={ // melu, miettimisaika, suojatodennäköisyys, taikaesinelisä
 aggr:{n:1,th:.85,sh:-.2},def:{n:1,th:1.1,sh:.35},snip:{n:.6,th:1.25,sh:0},trick:{n:1.1,th:1,sh:0},
 aven:{n:1,th:1,sh:0},tyc:{n:1,th:1,sh:.1},bers:{n:1.3,th:.7,sh:-.45},tact:{n:.85,th:1.1,sh:.1}};
const pm=t=>PM[t.pers]||{n:1,th:1,sh:0};
let ai=null;
function aiStart(t){
  const lv=LV[t.lvl];
  ai={stage:'think',tm:0,acts:[],goal:null};
  let sp=clamp(lv.sh+(t.lvl>=2?pm(t).sh:0),0,1);
  if(t.lvl>=4&&t.hp<70)sp=1;
  if(t.shield<=0&&Math.random()<sp){
    if(t.inv.heavy_shield>0)ai.acts.push('heavy_shield');else if(t.inv.shield>0)ai.acts.push('shield');
  }
  if(t.mag<=0&&t.inv.magnet>0&&Math.random()<.4+sp*.5+(t.pers==='def'?.3:0))ai.acts.push('magnet');
  if(t.hp<=55&&t.inv.repair>0&&t.lvl>=2)ai.acts.push('repair');
}
function aiPlan(t){
  const lv=LV[t.lvl],target=aiChooseTarget(t),cap=maxPow(t);
  if(!target)return {ang:90,pow:Math.min(50,cap),w:WID.baby,target:null};
  const w=aiChooseWeapon(t,target);
  let tp={x:target.x,y:target.y-6};
  if(t.mem&&t.mem.tid===target.i&&lv.mem>0)tp.x+=clamp(t.mem.dx,-120,120)*lv.mem;
  const wnd=wind*lv.wk;
  let s;
  if(w.mv==='laser'){
    const a0=Math.atan2(-(tp.y-(t.y-9)),tp.x-t.x)*180/Math.PI,tip=tipFor(t,a0);
    s={a:Math.atan2(-(tp.y-tip.y),tp.x-tip.x)*180/Math.PI,p:cap};
  }else if(w.mv==='drone')s={a:target.x>=t.x?62:118,p:cap};
  else s=solveShot(t,tp,wnd,lv.aS,lv.pS,cap,w.k==='roll',w.mv);
  const nm=pm(t).n;
  let ang=s.a+gauss()*lv.aN*nm,pow=s.p+gauss()*lv.pN*nm;
  if(w.mv==='laser'||w.mv==='drone'){pow=cap;if(w.mv==='drone')ang=s.a+gauss()*lv.aN*.5;}
  if(t.lvl===1&&Math.random()<.2){ang=rnd(20,160);pow=rnd(30,100);}
  return {ang:clamp(ang,0,180),pow:clamp(pow,5,cap),w,target};
}
function aiUpdate(dt){
  const t=tanks[cur];
  if(!ai||!t||!t.alive||t.lvl===0)return;
  const lv=Object.assign({},LV[t.lvl]);lv.think*=pm(t).th;
  ai.tm+=dt;
  if(ai.stage==='think'){
    if(ai.tm<lv.think)return;
    if(ai.acts.length){t.sel=ai.acts.shift();useItem(t);ai.tm=lv.think*.55;return;}
    const p=aiPlan(t);
    t.sel=p.w.id;ai.goal=p;ai.stage='aim';ai.tm=0;
  }else if(ai.stage==='aim'){
    const g=ai.goal,cap=maxPow(t);
    const da=g.ang-t.ang,dp=Math.min(g.pow,cap)-t.pow;
    t.ang+=clamp(da,-110*dt,110*dt);t.pow+=clamp(dp,-90*dt,90*dt);
    if(Math.abs(da)<.3&&Math.abs(dp)<.3){t.ang=g.ang;t.pow=Math.min(g.pow,cap);ai.stage='fire';ai.tm=0;}
  }else if(ai.stage==='fire'){
    if(ai.tm>lv.think*.5){
      const g=ai.goal;
      t.lastAim=g.target?{tid:g.target.i,tx:g.target.x}:null;
      ai=null;
      doFire(t);
    }
  }
}
function aiBuy(t){
  const L=t.lvl;if(!L)return;
  const tries=Math.max(1,Math.round(L*3*(t.pers==='snip'?.6:1)));
  for(let i=0;i<tries;i++){
    const c=WP.filter(w=>!w.hid&&!w.inf&&w.price<=t.money&&(t.inv[w.id]||0)<12&&!['dirt','dig','tracer'].includes(w.k)&&(w.k!=='roll'||LV[L].roll));
    if(!c.length)break;
    if(L===1&&Math.random()<.7)continue;
    let wsum=0;const ws=c.map(w=>{
      let v=1;
      if(L>=3)v+=w.price/4000;
      if(L>=3&&(w.k==='shield'||w.k==='chute'||w.k==='repair'||w.k==='magnet'))v+=3;
      if(L>=2){const P=t.pers;
        if(P==='def'&&['shield','chute','repair','magnet'].includes(w.k))v+=4;
        if((P==='aggr'||P==='bers')&&(w.dmg||0)>=90)v+=2.5;
        if(P==='tyc')v+=w.price/2500;
        if(P==='trick'&&(w.mv||['leap','burrow','split','fire'].includes(w.k)))v+=3;
        if(P==='snip'&&w.k==='std')v+=1.5;}
      if(L<=2)v=1/(1+w.price/5000);
      wsum+=v;return v;});
    let r=Math.random()*wsum,k=0;
    for(;k<c.length-1;k++){r-=ws[k];if(r<=0)break;}
    const w=c[k];
    t.money-=w.price;t.inv[w.id]=(t.inv[w.id]||0)+w.bundle;
  }
}

/* ====== Moninpeli: yhteys ja aula (PeerJS / WebRTC) ====== */
const PEER_SRC='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',NET_MAX=8;
const NET={peer:null,role:null,code:'',conns:[],host:null,players:[],me:0,timer:null,gen:0};
function netCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s;}
function netLoad(ok,fail){
  if(window.Peer)return ok();
  const s=document.createElement('script');s.src=PEER_SRC;s.onload=()=>window.Peer?ok():fail();s.onerror=fail;document.head.appendChild(s);
}
function netClose(){
  NET.gen++;clearInterval(NET.timer);NET.timer=null;
  try{NET.peer&&NET.peer.destroy();}catch(e){}
  NET.peer=null;NET.role=null;NET.conns=[];NET.host=null;NET.players=[];NET.code='';
}
function netName(){return cleanName(cfg.names[0]);}
function netUniq(name,except){
  let n=name,k=2;const used=new Set(NET.players.filter(p=>p!==except).map(p=>p.name.toLowerCase()));
  while(used.has(n.toLowerCase()))n=name.slice(0,11)+' '+k++;return n;
}
function netSend(c,m){try{c.open&&c.send(m);}catch(e){}}
function netBroadcast(){
  NET.players.forEach((p,i)=>{if(p.conn)netSend(p.conn,{t:'lobby',players:NET.players.map(q=>({name:q.name,ready:q.ready})),you:i});});
  renderLobby();
}
function netBeat(){ // sydämenlyönti: katkenneet yhteydet pudotetaan 14 s kuluttua
  const now=Date.now();
  if(NET.role==='host'){
    for(const p of NET.players.slice(1)){netSend(p.conn,{t:'ping'});if(now-p.seen>14000)netDrop(p.conn);}
  }else if(NET.host){
    netSend(NET.host,{t:'ping'});
    if(now-NET.seen>14000)netHostGone();
  }
}
function netDrop(conn){
  const i=NET.players.findIndex(p=>p.conn===conn);
  if(i>0){NET.players.splice(i,1);try{conn.close();}catch(e){}netBroadcast();}
}
function netHostGone(){
  if(NET.role!=='guest')return;
  netClose();netMenu(T('net_host_left'));
}
function netHostRoom(attempt){
  const gen=++NET.gen;
  netLoad(()=>{
    if(gen!==NET.gen)return;
    const code=netCode(),peer=new Peer('tsota2-'+code,window.PEER_OPTS||{});
    NET.peer=peer;NET.role='host';NET.code=code;
    peer.on('open',()=>{
      if(gen!==NET.gen)return;
      NET.players=[{name:netName()||T('ph_player',1),ready:true,conn:null,seen:0}];NET.me=0;
      NET.timer=setInterval(netBeat,4000);renderLobby();
    });
    peer.on('error',e=>{
      if(gen!==NET.gen)return;
      if(e.type==='unavailable-id'&&(attempt||0)<5){try{peer.destroy();}catch(_){}NET.peer=null;netHostRoom((attempt||0)+1);}
      else{netClose();netMenu(T('net_err'));}
    });
    peer.on('connection',conn=>{
      conn.on('data',m=>netHostMsg(conn,m));
      conn.on('close',()=>netDrop(conn));
      conn.on('error',()=>netDrop(conn));
    });
    showOv('<div class="card"><h2>'+T('net_title')+'</h2><p>'+T('net_connecting')+'</p></div>');
  },()=>{netClose();netMenu(T('net_load_err'));});
}
function netHostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  let p=NET.players.find(q=>q.conn===conn);
  if(m.t==='hello'&&!p){
    if(NET.players.length>=NET_MAX){netSend(conn,{t:'full'});setTimeout(()=>{try{conn.close();}catch(e){}},300);return;}
    p={name:'',ready:false,conn,seen:Date.now()};
    p.name=netUniq(cleanName(m.name)||T('ph_player',NET.players.length+1),p);
    NET.players.push(p);netBroadcast();return;
  }
  if(!p)return;
  p.seen=Date.now();
  if(m.t==='name'){p.name=netUniq(cleanName(m.name)||p.name,p);netBroadcast();}
  else if(m.t==='ready'){p.ready=!!m.v;netBroadcast();}
}
function netJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(code.length!==4){netMenu(T('net_bad_code'));return;}
  const gen=++NET.gen;
  showOv('<div class="card"><h2>'+T('net_title')+'</h2><p>'+T('net_connecting')+'</p><button class="go alt" id="ncancel">'+T('net_back')+'</button></div>');
  $('ncancel').onclick=()=>{netClose();netMenu();};
  netLoad(()=>{
    if(gen!==NET.gen)return;
    const peer=new Peer(window.PEER_OPTS||{});NET.peer=peer;NET.role='guest';NET.code=code;
    const fail=msg=>{if(gen!==NET.gen)return;netClose();netMenu(msg);};
    const tmo=setTimeout(()=>fail(T('net_nohost')),12000);
    peer.on('error',e=>{clearTimeout(tmo);fail(e.type==='peer-unavailable'?T('net_nohost'):T('net_err'));});
    peer.on('open',()=>{
      if(gen!==NET.gen)return;
      const conn=peer.connect('tsota2-'+code,{reliable:true});
      NET.host=conn;
      conn.on('open',()=>{clearTimeout(tmo);NET.seen=Date.now();NET.timer=setInterval(netBeat,4000);netSend(conn,{t:'hello',name:netName()});});
      conn.on('data',m=>{
        if(!m||typeof m!=='object')return;NET.seen=Date.now();
        if(m.t==='lobby'){NET.players=m.players;NET.me=m.you;renderLobby();}
        else if(m.t==='full')fail(T('net_full'));
        else if(m.t==='start')netStartStub();
      });
      conn.on('close',()=>{clearTimeout(tmo);if(NET.role==='guest'&&NET.players.length)netHostGone();else fail(T('net_nohost'));});
    });
  },()=>{if(gen===NET.gen){netClose();netMenu(T('net_load_err'));}});
}
function netMenu(msg){
  paused=false;phase='menu';
  showOv('<div class="card">'+langPicker()+'<h2>'+T('net_title')+'</h2><p>'+T('net_intro')+'</p>'+
    (msg?'<p style="color:var(--danger)" id="nmsg">'+esc(msg)+'</p>':'')+

    '<button class="go alt" id="njoin">'+T('net_join')+'</button><button class="go alt" id="nback">'+T('net_back')+'</button></div>');

function renderLobby(){

/* ====== Ase- ja käyttöliittymä ====== */
const ov=$('ov'),elAng=$('ang'),elPow=$('pow'),elFire=$('fire');
let paused=false,settle=0,shopQ=[],shopI=0,lastUI='';
function invList(t){return WP.filter(w=>!w.hid&&w.k!=='chute'&&(w.inf||(t.inv[w.id]||0)>0));}
function isHuman(){const t=tanks[cur];return !!t&&t.lvl===0&&t.alive&&phase==='aim'&&!paused&&ov.classList.contains('hidden');}
function syncUI(){
  const t=tanks[cur];if(!t)return;
  const list=invList(t);
  if(!list.find(w=>w.id===t.sel))t.sel='baby';
  const cap=maxPow(t);if(t.pow>cap)t.pow=cap;
  const w=WID[t.sel],h=isHuman();
  const key=[Math.round(t.ang*10),Math.round(t.pow*10),cap,t.sel,t.inv[t.sel],h,phase,cur].join('|');
  if(key===lastUI)return;lastUI=key;
  elPow.max=cap;
  elAng.value=Math.round(t.ang);elPow.value=Math.round(t.pow);
  $('angV').textContent=Math.round(t.ang);
  $('powV').innerHTML=Math.round(t.pow)+(cap<100?'<small>'+T('powmax',cap)+'</small>':'');
  const cnt=w.inf?'∞':'×'+(t.inv[w.id]||0);
  $('wName').innerHTML='<span style="color:'+w.col+'">'+esc(wn(w))+'</span> '+cnt+'<small>'+esc(wd(w))+'</small>';
  const use=w.k==='shield'||w.k==='repair'||w.k==='magnet';
  elFire.textContent=use?T('b_use'):T('b_fire');
  for(const id of ['ang','pow','aDn','aUp','pDn','pUp','wPrev','wNext','fire'])$(id).disabled=!h;
}
function adj(key,d){
  const t=tanks[cur];if(!isHuman())return;
  audio();
  if(key==='ang')t.ang=clamp(Math.round(t.ang+d),0,180);else t.pow=clamp(Math.round(t.pow+d),5,maxPow(t));
  syncUI();
}
function cycleWeapon(d){
  const t=tanks[cur];if(!isHuman())return;
  const list=invList(t);let i=list.findIndex(w=>w.id===t.sel);
  i=(i+d+list.length)%list.length;t.sel=list[i].id;syncUI();
}
function useItem(t){
  const w=WID[t.sel];
  if(w.k==='shield'){t.shield=Math.max(t.shield,w.amt);t.shAge=0;floatText(t.x,t.y-28,T('fx_shield_on'),'#7fe3f0');}
  else if(w.k==='magnet'){t.mag=1;t.magAge=0;floatText(t.x,t.y-28,T('fx_magnet_on'),'#e599f7');}
  else if(w.k==='repair'){t.hp=Math.min(100,t.hp+w.amt);floatText(t.x,t.y-28,'+'+w.amt,'#58d68d');}
  t.inv[w.id]--;t.sel='baby';
}
function doFire(t){
  const w=WID[t.sel];
  if(w.k==='shield'||w.k==='repair'||w.k==='magnet'){useItem(t);lastUI='';syncUI();return;}
  if(!w.inf){t.inv[w.id]--;if(t.inv[w.id]<=0)t.sel='baby';}
  t.pow=Math.min(t.pow,maxPow(t));
  t.last={ang:Math.round(t.ang),pow:Math.round(t.pow)};
  const tip=barrelTip(t),a=t.ang*Math.PI/180,v=w.mv==='laser'?900:w.mv==='drone'?DRONE_V:t.pow*VM;
  camF={x:tip.x,y:tip.y};aimDrag=null;
  projs.push({x:tip.x,y:tip.y,sx:tip.x,sy:tip.y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,w,owner:t,t:0,hops:w.hops||0,trail:[],main:true,grp:++grpN});
  for(let i=0;i<8;i++)addPart({x:tip.x,y:tip.y,vx:Math.cos(a)*rnd(20,90)+rnd(-20,20),vy:-Math.sin(a)*rnd(20,90)+rnd(-20,20),life:.35,max:.35,s:rnd(1.5,3),col:'#ffe08a',t:'f'});
  shake=Math.max(shake,1.5);sndShot();
  phase='fly';settle=0;lastUI='';syncUI();
}
function holdBtn(id,key,d){
  const b=$(id);let t1=0,t2=0;
  const stop=()=>{clearTimeout(t1);clearInterval(t2);};
  b.addEventListener('pointerdown',e=>{e.preventDefault();adj(key,d);stop();t1=setTimeout(()=>{t2=setInterval(()=>adj(key,d),55);},350);});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,stop);
}
holdBtn('aDn','ang',-1);holdBtn('aUp','ang',1);holdBtn('pDn','pow',-1);holdBtn('pUp','pow',1);
elAng.addEventListener('input',()=>{const t=tanks[cur];if(isHuman()){t.ang=+elAng.value;syncUI();}});
elPow.addEventListener('input',()=>{const t=tanks[cur];if(isHuman()){t.pow=Math.min(+elPow.value,maxPow(t));syncUI();}});
$('wPrev').addEventListener('click',()=>cycleWeapon(-1));
$('wNext').addEventListener('click',()=>cycleWeapon(1));
elFire.addEventListener('click',()=>{audio();if(isHuman())doFire(tanks[cur]);});
$('btnSnd').addEventListener('click',()=>{muted=!muted;if(!muted)audio();$('btnSnd').classList.toggle('off',muted);});
$('btnMenu').addEventListener('click',()=>{if(phase==='menu')return;paused=true;showPause();});

/* ====== Vetotähtäys ====== */
function toWorld(e){
  const r=cv.getBoundingClientRect(),sc=Math.min(r.width/W,r.height/H);
  const u=(e.clientX-r.left-(r.width-W*sc)/2)/sc,v=(e.clientY-r.top-(r.height-H*sc)/2)/sc;
  return {x:(u-W/2)/cam.z+cam.x,y:(v-H/2)/cam.z+cam.y};
}
let dragId=null;
function dragAim(e){
  const t=tanks[cur];if(!isHuman())return;
  const w=toWorld(e),p=tankPos(t),dx=p.x-w.x,dy=p.y-w.y,len=Math.hypot(dx,dy);
  aimDrag=w;
  if(len<8)return;
  let ang=Math.atan2(-dy,dx)*180/Math.PI;
  if(ang<0)ang=ang<-90?180:0;
  t.ang=clamp(Math.round(ang),0,180);
  t.pow=clamp(Math.round(len*.8),5,maxPow(t));
  syncUI();
}
cv.addEventListener('pointerdown',e=>{
  if(!isHuman())return;
  audio();dragId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  dragAim(e);e.preventDefault();
});
cv.addEventListener('pointermove',e=>{if(dragId===e.pointerId)dragAim(e);});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,e=>{if(dragId===e.pointerId){dragId=null;aimDrag=null;}});
let speed=1;
$('btnSpd').addEventListener('click',()=>{speed=speed===1?3:speed===3?8:1;$('btnSpd').textContent='×'+speed;});
function camLabel(){const b=$('btnCam');b.classList.toggle('off',!camOn);b.textContent=T('b_cam')+(camOn?' ✓':' ✗');b.setAttribute('aria-pressed',camOn?'true':'false');}
$('btnCam').addEventListener('click',()=>{camOn=!camOn;cfg.cam=camOn?1:0;saveCfg();camLabel();});
camLabel();
addEventListener('keydown',e=>{
  if(!isHuman())return;
  const k=e.key;
  if(k==='ArrowLeft'){adj('ang',e.shiftKey?5:1);e.preventDefault();}
  else if(k==='ArrowRight'){adj('ang',e.shiftKey?-5:-1);e.preventDefault();}
  else if(k==='ArrowUp'){adj('pow',e.shiftKey?5:1);e.preventDefault();}
  else if(k==='ArrowDown'){adj('pow',e.shiftKey?-5:-1);e.preventDefault();}
  else if(k==='Tab'||k==='w'){cycleWeapon(1);e.preventDefault();}
  else if(k===' '||k==='Enter'){audio();doFire(tanks[cur]);e.preventDefault();}
});

/* ====== Pelikulku ====== */
function showOv(html,cls){ov.innerHTML=html;ov.classList.remove('hidden');ov.classList.toggle('finale',cls==='finale');lastUI='';}
function hideOv(){ov.classList.add('hidden');ov.classList.remove('finale');lastUI='';}
function teamName(k){return '<span style="color:'+TEAM_COL[k]+'">'+(k?'■ ':'▲ ')+T('team'+(k+1))+'</span>';}
function layoutTanks(){
  const n=tanks.length,order=[];for(let i=0;i<n;i++)order.push(i);
  for(let i=n-1;i>0;i--){const j=srint(0,i);[order[i],order[j]]=[order[j],order[i]];}
  if(teamMode){ // joukkueet vastakkaisille puolille, järjestys joukkueen sisällä satunnainen
    const left=sr()<.5?0:1;
    order.sort((a,b)=>((tanks[a].team===left?0:1)-(tanks[b].team===left?0:1)));
  }
  order.forEach((ti,slot)=>{
    const t=tanks[ti],seg=W/n;
    t.x=Math.round(clamp((slot+.5)*seg+srnd(-seg*.27,seg*.27),32,W-32));
    let s=0;for(let k=-10;k<=10;k++)s+=surf(t.x+k);s/=21;
    for(let k=-16;k<=16;k++){const i=t.x+k;if(i<0||i>=W)continue;const m=Math.abs(k)<=10?1:1-(Math.abs(k)-10)/6;ground[i]=ground[i]*(1-m)+s*m;}
    t.y=surf(t.x);
  });
}
function isDesktop(){
  try{return matchMedia('(hover:hover) and (pointer:fine)').matches&&Math.min(innerWidth,screen.width||9999)>=1000;}catch(e){return false;}
}
function slotCount(){return isDesktop()?8:4;}
function fitWorld(){
  const r=$('stage').getBoundingClientRect(),asp=r.width/Math.max(1,r.height);
  let h=450,w;
  if(isDesktop()){h=clamp(Math.round(r.height/1.15),450,760);w=clamp(Math.round(h*asp),480,1500);}
  else w=clamp(Math.round(450*asp),480,960);
  if(w!==W||h!==H||!bgCv){W=w;H=h;ground=new Float32Array(W);mask=new Uint8Array(W*H);bgCv=null;tCv=null;cv.width=W*S;cv.height=H*S;cam.x=W/2;cam.y=H/2;}
}
function startRound(){
  prevCur=-1;turnNo=0;seedSim(mixSeed(matchSeed,round,0));
  fitWorld();genTerrain();th=spick(THEMES);buildSky();
  projs=[];rolls=[];burrows=[];fires=[];blasts=[];parts=[];texts=[];trails=[];pending=[];shake=0;ai=null;
  for(const t of tanks){
    t.shield=0;t.shAge=null;t.mag=0;t.magAge=null;
    t.alive=true;t.hp=100;t.dHp=100;t.fall=0;t.vy=0;t.mem=null;t.lastAim=null;t.acc=0;t.sel='baby';t.last=null;t.lastImp=null;t.say=null;t.dying=0;t.air=null;t.rot=0;t.smoulder=0;t.earn={dmg:0,kills:0,nk:0,bonus:0};}
  layoutTanks();commitTerrain();
  for(const t of tanks)t.y=ground[clamp(Math.round(t.x),0,W-1)];
  camF=null;cam.z=1;cam.x=W/2;cam.y=H/2;aimDrag=null;
  setWeather();
  wind=Math.round(srnd(-45,45)*wxWindK());
  cur=srint(0,tanks.length-1);
  hideOv();beginTurn();
}
/* Suojat vanhenevat omilla vuoroilla: yksi kierros = kaikki ovat ampuneet ja oma vuoro alkaa uudelleen */
function ageDefences(t){
  if(t.shAge!=null){
    t.shAge++;
    if(t.shAge===2&&t.shield>0){t.shield=Math.round(t.shield*.5);floatText(t.x,t.y-28,T('fx_shield_weak'),'#7fe3f0');}
    else if(t.shAge>=4){if(t.shield>0)floatText(t.x,t.y-28,T('fx_shield_down'),'#7fe3f0');t.shield=0;t.shAge=null;}
  }
  if(t.shield<=0)t.shAge=null;
  if(t.magAge!=null){
    t.magAge++;
    if(t.magAge>=3){if(t.mag>0)floatText(t.x,t.y-34,T('fx_magnet_down'),'#e599f7');t.mag=0;t.magAge=null;}
  }
}
function beginTurn(){
  wxTurn();
  phase='aim';settle=0;lastUI='';
  const t=tanks[cur];
  ageDefences(t);
  if(t.lvl)aiStart(t);
  if(t.lvl===0&&hotSeat()&&prevCur!==cur){prevCur=cur;coverCard(t,'turn',()=>{hideOv();syncUI();});}
  else if(t.lvl===0)prevCur=cur;
  syncUI();
}
function endTurn(){
  const alive=tanks.filter(t=>t.alive);
  if(teamMode?new Set(alive.map(t=>t.team)).size<=1:alive.length<=1){roundEnd(alive[0]||null);return;}
  do{cur=(cur+1)%tanks.length;}while(!tanks[cur].alive);
  turnNo++;seedSim(mixSeed(matchSeed,round,turnNo));
  wind=Math.round(clamp(wind+srnd(-12,12)*wxWindK(),-wxWindMax(),wxWindMax()));
  beginTurn();
}
function earnTotal(t){return t.earn.dmg+t.earn.kills+t.earn.bonus;}
function earnDetail(t){
  const a=[];
  if(t.earn.dmg>0)a.push(T('earn_dmg',money(t.earn.dmg)));
  if(t.earn.nk>0)a.push(T(t.earn.nk>1?'earn_killn':'earn_kill1',t.earn.nk,money(t.earn.kills)));
  if(t.earn.bonus>0)a.push(T('earn_bonus',money(t.earn.bonus)));
  return a.join(' · ');
}
function tableHtml(withEarn){
  const list=tanks.slice().sort((a,b)=>b.wins-a.wins||b.money-a.money);
  const dot=t=>'<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+t.col+'"></i> '+(t.team>=0?'<span style="color:'+TEAM_COL[t.team]+'">'+(t.team?'■':'▲')+'</span> ':'');
  if(!withEarn){
    return '<table><tr><th>'+T('th_player')+'</th><th>'+T('th_wins')+'</th><th>'+T('th_money')+'</th></tr>'+
      list.map(t=>'<tr><td>'+dot(t)+esc(t.name)+'</td><td>'+t.wins+' ★</td><td>'+money(t.money)+'</td></tr>').join('')+'</table>';
  }
  return '<table><tr><th>'+T('th_player')+'</th><th>'+T('th_wins')+'</th><th>'+T('th_money')+'</th><th style="text-align:right">'+T('th_round')+'</th></tr>'+
    list.map(t=>'<tr class="main"><td>'+dot(t)+esc(t.name)+'</td><td>'+t.wins+' ★</td><td>'+money(t.money)+'</td><td class="earn">+'+money(earnTotal(t))+'</td></tr>'+
      '<tr class="sub"><td colspan="4">'+(earnDetail(t)||T('earn_none'))+'</td></tr>').join('')+'</table>';
}
function roundEnd(w){
  phase='over';
  const winners=w?(teamMode?tanks.filter(t=>t.team===w.team):[w]):[];
  winners.forEach(t=>t.wins++);
  const lead=Math.max(...tanks.map(t=>t.wins));
  for(const t of tanks){
    const b=3000+Math.min(4500,1500*(lead-t.wins))+(winners.includes(t)?6000:0);
    t.money+=b;t.earn.bonus+=b;
  }
  const last=round>=maxRounds;
  if(last)clearSave();else saveGame(round+1);
  setTimeout(()=>{
    showOv('<div class="card"><h2>'+(w?(teamMode?T('re_win',round,maxRounds,teamName(w.team)):T('re_win',round,maxRounds,esc(w.name))):T('re_tie',round,maxRounds))+'</h2>'+
      '<p>'+T('re_info',money(3000),money(4500),money(6000),money(KILL_BONUS))+'</p>'+
      tableHtml(true)+'<button class="go" id="nx">'+(last?T('b_podium'):T('b_shop_next'))+'</button></div>');
    $('nx').onclick=()=>{audio();if(last)showFinale();else{round++;beginShops();}};
  },1100);
}

}
function clearSave(){try{localStorage.removeItem('tsota2g');}catch(e){}}
function readSave(){try{const s=JSON.parse(localStorage.getItem('tsota2g')||'null');return s&&s.tanks&&s.tanks.length>=2?s:null;}catch(e){return null;}}
function resumeGame(sv){
  tanks=sv.tanks.map(o=>{const t=makeTank(o.i,o.lvl,o.name);t.wins=o.wins;t.money=o.money;t.inv=o.inv;t.kills=o.kills||0;t.team=o.team==null?-1:o.team;if(t.lvl>0){t.leader=o.ld||String(o.name).split(' ').pop();t.pers=persOf(t.leader);};return t;});
  teamMode=sv.mode||0;
  maxRounds=sv.maxRounds;round=sv.round;wallMode=sv.walls||0;
  beginShops();
}
function beginShops(){
  for(const t of tanks)if(t.lvl)aiBuy(t);
  shopQ=tanks.filter(t=>t.lvl===0);shopI=0;
  if(!shopQ.length){startRound();return;}
  phase='shop';shopStart();
}
const SHOP_CATS=[
 {id:'bombs',k:'cat_bombs',ids:['missile','baby_nuke','nuke','mega_nuke','bunker']},
 {id:'paths',k:'cat_paths',ids:['laser','glider','drone']},
 {id:'split',k:'cat_split',ids:['cluster','mirv','funky','deaths_head']},
 {id:'special',k:'cat_special',ids:['leap','baby_roller','roller','heavy_roller','napalm','hot_napalm','digger','dirt']},
 {id:'shields',k:'cat_shields',ids:['shield','heavy_shield','magnet']},
 {id:'gear',k:'cat_gear',ids:['repair','parachute','tracer']}
];
let shopTab='bombs';
function statLine(w){
  if(w.k==='shield')return T('st_shield',w.amt);
  if(w.k==='magnet')return T('st_magnet');
  if(w.k==='repair')return T('st_repair',w.amt);
  if(w.k==='chute')return T('st_chute');
  if(w.k==='tracer')return T('st_tracer');
  if(w.k==='split'){const c=WID[w.sp.id];return T('st_split',w.sp.n,c.r,c.dmg);}
  if(w.k==='fire')return T('st_fire',w.r,w.fdps,w.ttl);
  if(w.k==='dirt')return T('st_dirt',w.r);
  if(w.k==='dig')return T('st_dig');
  if(w.mv==='laser')return T('st_laser',w.r,w.dmg);
  if(w.mv==='glide')return T('st_glide',w.r,w.dmg);
  if(w.mv==='drone')return T('st_drone',w.r,w.dmg);
  return T('st_std',w.r,w.dmg);
}
/* Hot seat: laite kiertää ihmispelaajalta toiselle, suojaruutu piilottaa edellisen valinnat */
function hotSeat(){return cfg.hot!==0&&tanks.filter(t=>t.lvl===0).length>=2;}
function coverCard(t,kind,go){
  showOv('<div class="card cover"><h2>'+T('hs_title')+'</h2><div class="hsname" style="color:'+t.col+'">'+'<i class="hsdot" style="background:'+t.col+'"></i><span>'+esc(t.name)+'</span></div>'+
    (t.team>=0?'<p>'+teamName(t.team)+'</p>':'')+'<p>'+T(kind==='shop'?'hs_shop':'hs_turn')+'</p><button class="go" id="hsok">'+T('hs_ready')+'</button></div>');
  $('hsok').onclick=()=>{audio();go();};
}
function shopStart(){
  const t=shopQ[shopI];
  if(hotSeat())coverCard(t,'shop',()=>openShop());else openShop();
}
let prevCur=-1;
function openShop(keepScroll){
  const t=shopQ[shopI],old=ov.querySelector('.shoplist');const sc=keepScroll&&old?old.scrollTop:0;
  const cat=SHOP_CATS.find(c=>c.id===shopTab)||SHOP_CATS[0];
  let h='<div class="card shop"><div class="shophead"><h2>'+T('shop_title')+' · <span style="color:'+t.col+'">'+esc(t.name)+'</span></h2>'+
    '<div class="money">'+money(t.money)+'</div><p style="margin:2px 0 6px">'+T('shop_round',round,maxRounds)+'</p><div class="tabs" role="tablist">'+
    SHOP_CATS.map(c=>{const own=c.ids.reduce((a,id)=>a+(t.inv[id]||0),0);
      return '<button class="tab" role="tab" data-cat="'+c.id+'" aria-selected="'+(c.id===cat.id)+'">'+T(c.k)+(own?'<i>'+own+'</i>':'')+'</button>';}).join('')+
    '</div></div><div class="shoplist">';
  for(const w of cat.ids.map(id=>WID[id]).sort((a,b)=>a.price-b.price)){
    const own=t.inv[w.id]||0,can=t.money>=w.price&&own<99;
    h+='<div class="item" data-id="'+w.id+'" style="opacity:'+(can?1:.45)+';cursor:pointer"><i style="background:'+w.col+'"></i>'+
      '<div class="nm"><b>'+esc(wn(w))+'</b><small>'+esc(wd(w))+'</small><small class="st">'+esc(statLine(w))+'</small></div>'+
      '<div class="pr">'+money(w.price)+'<br><small style="color:var(--muted)">+'+w.bundle+' · '+T('shop_own',own)+'</small></div></div>';
  }
  h+='</div><button class="go" id="done">'+(shopI<shopQ.length-1?T('b_next_player'):T('b_start_round'))+'</button></div>';
  showOv(h);
  ov.querySelector('.shoplist').scrollTop=sc;
  ov.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{shopTab=el.dataset.cat;audio();openShop();});
  ov.querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    const w=WID[el.dataset.id];
    if(t.money>=w.price&&(t.inv[w.id]||0)<99){t.money-=w.price;t.inv[w.id]=(t.inv[w.id]||0)+w.bundle;audio();openShop(true);}
  });
  $('done').onclick=()=>{audio();if(shopI<shopQ.length-1){shopI++;shopStart();}else startRound();};
}
function setLang(c){
  LANG=c;try{localStorage.setItem('tsota2lang',c);}catch(e){}
  applyStatic();
}
function applyStatic(){
  document.documentElement.lang=LANG;document.title=T('doc_title');
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;el.textContent=T(k==='hint'&&isDesktop()?'hint_pc':k);});
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',T(el.dataset.ta)));
  camLabel();lastUI='';if(tanks.length&&phase!=='menu')syncUI();
}
function langPicker(){
  return '<div class="tabs langs" role="tablist" aria-label="'+T('slot_lang')+'">'+LANGS.map(([c,n])=>
    '<button class="tab" role="tab" data-lang="'+c+'" aria-selected="'+(c===LANG)+'">'+n+'</button>').join('')+'</div>';
}
function bindLang(again){ov.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);audio();again();});}
/* Asetusten luku/kirjoitus: vapaassa pelissä cfg.slots, joukkuepelissä cfg.tslots[joukkue][paikka] */
const sGet=i=>cfg.mode?cfg.tslots[Math.floor(i/cfg.mode)][i%cfg.mode]:cfg.slots[i];
const sSet=(i,v)=>{if(cfg.mode)cfg.tslots[Math.floor(i/cfg.mode)][i%cfg.mode]=v;else cfg.slots[i]=v;};
const nGet=i=>cfg.mode?cfg.tnames[Math.floor(i/cfg.mode)][i%cfg.mode]:cfg.names[i];
const nSet=(i,v)=>{if(cfg.mode)cfg.tnames[Math.floor(i/cfg.mode)][i%cfg.mode]=v;else cfg.names[i]=v;};
const slotsNow=()=>cfg.mode?2*cfg.mode:slotCount();
function readSetupForm(){
  if(!$('s0'))return;
  const n=slotsNow();
  for(let i=0;i<n;i++){sSet(i,+$('s'+i).value);nSet(i,cleanName($('n'+i).value));}
  cfg.rounds=+$('rds').value;cfg.walls=+$('wl').value;cfg.weather=+$('wxs').value;cfg.hot=+$('hot').value;
}
function showSetup(){
  $('app').classList.remove('fin');
  phase='menu';paused=false;
  const n=slotsNow();
  const opt=(v,cur,s)=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+s+'</option>';
  let h='<div class="card">'+langPicker()+'<h1>'+T('title')+'</h1><p>'+T('setup_intro')+'</p>'+
    '<div class="slot"><i style="background:var(--accent)"></i><span>'+T('slot_mode')+'</span><select id="mode">'+
    opt(0,cfg.mode,T('mode_ffa'))+opt(1,cfg.mode,'1 vs 1')+opt(2,cfg.mode,'2 vs 2')+opt(3,cfg.mode,'3 vs 3')+'</select></div>';
  for(let i=0;i<n;i++){
    if(cfg.mode&&i%cfg.mode===0){const k=i/cfg.mode;h+='<div class="teamhead" style="color:'+TEAM_COL[k]+'">'+(k?'■ ':'▲ ')+T('team'+(k+1))+'</div>';}
    const cv=sGet(i);
    h+='<div class="slot"><i style="background:'+COLORS[i]+'"></i><span>'+T('slot_player',i+1)+'</span><select id="s'+i+'">'+
      opt(-1,cv,T('opt_none'))+opt(0,cv,T('opt_human'))+
      [1,2,3,4,5].map(k=>opt(k,cv,T('opt_cpu',rankName(k)))).join('')+'</select></div>'+
      '<div class="slot namerow" id="nr'+i+'"'+(cv===0?'':' hidden')+'><i></i><span>'+T('slot_name')+'</span>'+
      '<input type="text" id="n'+i+'" maxlength="14" autocomplete="off" placeholder="'+esc(T('ph_player',i+1))+'" value="'+esc(nGet(i)||'')+'"></div>';
  }
  h+='<div class="slot"><i style="background:var(--accent)"></i><span>'+T('slot_rounds')+'</span><select id="rds">'+
    [3,5,10,15].map(k=>opt(k,cfg.rounds,k)).join('')+'</select></div>'+
    '<div class="slot"><i style="background:var(--accent)"></i><span>'+T('slot_hot')+'</span><select id="hot">'+opt(1,cfg.hot===0?0:1,T('on'))+opt(0,cfg.hot===0?0:1,T('off'))+'</select></div>'+
    '<div class="slot"><i style="background:var(--accent)"></i><span>'+T('slot_weather')+'</span><select id="wxs">'+
    opt(0,cfg.weather|0,T('wx0'))+opt(1,cfg.weather|0,'☀ '+T('wx1'))+opt(2,cfg.weather|0,'⛈ '+T('wx2'))+opt(3,cfg.weather|0,'❄ '+T('wx3'))+'</select></div>'+
    '<div class="slot"><i style="background:var(--accent)"></i><span>'+T('slot_walls')+'</span><select id="wl">'+
    opt(0,cfg.walls,T('wall0'))+opt(1,cfg.walls,T('wall1'))+opt(2,cfg.walls,T('wall2'))+'</select></div>'+
    '<p id="err" style="color:var(--danger);margin:6px 0 0"></p><button class="go" id="start">'+T('b_start')+'</button><button class="go alt" id="guide">'+T('b_guide')+'</button><button class="go alt" id="netb">'+T('net_btn')+'</button>';
  const sv=readSave();
  if(sv)h+='<button class="go alt" id="resume">'+T('b_resume',sv.round,sv.maxRounds)+'</button>';
  h+='</div>';
  showOv(h);
  bindLang(()=>{readSetupForm();showSetup();});
  $('mode').onchange=()=>{readSetupForm();cfg.mode=+$('mode').value;showSetup();};
  for(let i=0;i<n;i++)$('s'+i).onchange=()=>{$('nr'+i).hidden=+$('s'+i).value!==0;};
  $('start').onclick=()=>{
    audio();
    readSetupForm();
    if(cfg.mode){
      for(let k=0;k<2;k++)if(!cfg.tslots[k].slice(0,cfg.mode).some(v=>v>=0)){$('err').textContent=T('err_team');return;}
    }else if(cfg.slots.slice(0,n).filter(v=>v>=0).length<2){$('err').textContent=T('err_min2');return;}
    saveCfg();startGame();
  };
  $('netb').onclick=()=>{readSetupForm();saveCfg();netMenu();};
  $('guide').onclick=()=>{readSetupForm();showTutorial(0,showSetup);};
  if(sv)$('resume').onclick=()=>{audio();resumeGame(sv);};
}
/* Aloitusopas */
function showTutorial(i,back){
  const N=6;i=clamp(i,0,N-1);
  showOv('<div class="card tut">'+langPicker()+'<h2>'+T('tut_t'+(i+1))+'</h2><p>'+T('tut_b'+(i+1))+'</p>'+
    '<div class="dots">'+Array.from({length:N},(_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div>'+
    '<div class="tbtns">'+(i>0?'<button class="go alt" id="tp">'+T('tut_prev')+'</button>':'')+
    '<button class="go" id="tn">'+(i<N-1?T('tut_next'):T('tut_done'))+'</button></div></div>');
  bindLang(()=>showTutorial(i,back));
  if(i>0)$('tp').onclick=()=>showTutorial(i-1,back);
  $('tn').onclick=()=>{audio();if(i<N-1)showTutorial(i+1,back);else{try{localStorage.setItem('tsota2tut','1');}catch(e){}back();}};
}
function tutSeen(){try{return localStorage.getItem('tsota2tut')==='1';}catch(e){return true;}}
/* Vastustajaesittely ennen ensimmäistä kauppaa */
function showBriefing(next){
  const ai=tanks.filter(t=>t.lvl>0);
  if(!ai.length){next();return;}
  showOv('<div class="card"><h2>'+T('brief_title')+'</h2>'+ai.map(t=>'<div class="slot" style="align-items:flex-start"><i style="background:'+t.col+'"></i><span style="flex:1"><b>'+esc(t.name)+'</b>'+
    (t.team>=0?' '+teamName(t.team):'')+'<br><b style="color:var(--accent)">'+T('pers_'+t.pers)+'</b> – <small>'+T('pd_'+t.pers)+'</small></span></div>').join('')+
    '<button class="go" id="bgo">'+T('b_continue')+'</button></div>');
  $('bgo').onclick=()=>{audio();next();};
}
function showPause(){
  showOv('<div class="card">'+langPicker()+'<h2>'+T('pause_title')+'</h2><button class="go" id="res">'+T('b_continue')+'</button><button class="go alt" id="nw">'+T('b_newgame')+'</button><button class="go alt" id="gd">'+T('b_guide')+'</button></div>');
  $('gd').onclick=()=>showTutorial(0,showPause);
  bindLang(showPause);
  $('res').onclick=()=>{paused=false;hideOv();syncUI();};
  $('nw').onclick=()=>{paused=false;showSetup();};
}
function startGame(){
  tanks=[];
  const n=slotsNow(),N=cfg.mode;
  let act=[];for(let i=0;i<n;i++){const v=sGet(i);if(v>=0)act.push({v,i,team:N?Math.floor(i/N):-1});}
  if(N){ // vuorojärjestys vuorotellen joukkueesta toiseen
    const a=act.filter(o=>o.team===0),b=act.filter(o=>o.team===1),m=[];
    for(let k=0;k<Math.max(a.length,b.length);k++){if(a[k])m.push(a[k]);if(b[k])m.push(b[k]);}
    act=m;
  }
  const used=new Set();
  const hum=act.filter(o=>o.v===0).map(o=>{
    let nm=cleanName(nGet(o.i))||T('ph_player',o.i+1);
    if(used.has(nm.toLowerCase()))nm=nm.slice(0,12)+' '+(o.i+1);
    used.add(nm.toLowerCase());return {o,n:nm};
  });
  const leaders=drawLeaders(act.filter(o=>o.v>0).length,[...used]);
  let li=0;
  act.forEach(o=>{
    let name,ldr='';
    if(o.v===0)name=hum.find(h=>h.o===o).n;
    else{ldr=leaders[li++];name=rankName(o.v)+' '+ldr;}
    const t=makeTank(o.i,o.v,name);t.team=o.team;
    if(o.v>0){t.leader=leaderKey(ldr);t.pers=persOf(t.leader);}
    tanks.push(t);
  });
  teamMode=N;
  matchSeed=(Math.random()*4294967296)>>>0;
  maxRounds=cfg.rounds;round=1;wallMode=cfg.walls||0;clearSave();
  showBriefing(beginShops);
}

/* ====== Pääsilmukka ====== */
let lastTs=0,accT=0;
function frame(ts){
  const rdt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  const dt=rdt*(phase==='aim'&&isHuman()?1:speed);
  if(!paused){
    accT+=dt;let n=0;
    const run=phase!=='menu'&&phase!=='shop';
    while(accT>=1/120&&n++<70){if(run)stepWorld(1/120);accT-=1/120;}
    updateCam(rdt);wxAnim(rdt);
    if(phase==='aim'){if(ov.classList.contains('hidden'))aiUpdate(dt);}
    else if(phase==='fly'){
      if(!busy()){settle+=dt;if(settle>.7)endTurn();}else settle=0;
    }
    else if(phase==='finale')updateFinale(dt);
    for(const t of tanks)if(!t.alive&&Math.random()<dt*2)addPart({x:t.x+rnd(-4,4),y:surf(t.x)-8,vx:rnd(-4,4),vy:-rnd(15,35),life:1.2,max:1.2,s:3,col:'#2a2d33',t:'m'});
    if(tanks.length)syncUI();
  }
  draw();
  requestAnimationFrame(frame);
}
function backdrop(){fitWorld();genTerrain();th=pick(THEMES);buildSky();commitTerrain();}
applyStatic();
backdrop();
showSetup();
let rzT=0;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(phase==='menu'||phase==='shop'||phase==='over'){const keep=phase;if(keep==='menu')backdrop();}},250);});
requestAnimationFrame(frame);
</script>
